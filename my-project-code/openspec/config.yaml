# OpenSpec 项目配置文件
# 说明：这是 AI 生成代码时的"基础宪法"，填写越准确，AI 生成的结果越贴合你的项目
# 带 * 的为必填项，其余可根据实际情况填写
#
# 重要（2026-04-20 工作流重定位后）：
# - 本文件的 rules.apply / rules.archive 段对 GSD 执行器（/gsd-execute-phase 等）同样生效
# - /opsx:propose / /opsx:apply / /opsx:explore / /opsx:continue / /opsx:ff / /opsx:verify 指令已废弃，不再使用
# - 本文件作用降为"产物归档格式规范 + AI 行为硬约束"，执行流由 GSD 承担

# ═══════════════════════════════════════
# 项目基本信息 *
# ═══════════════════════════════════════
project:
  name: "西南大学信息化项目全生命周期管理系统"              # 项目名称，如：采购管理系统
  description: "本系统是面向西南大学信息化建设办公室（信息办）及各二级单位（项目用户单位）的**信息化项目全生命周期管理平台**"       # 一句话描述项目是做什么的，如：用于管理企业内部采购申请、审批和执行流程
  stage: demo           # 当前阶段：demo（演示）/ development（开发）/ production（生产）

# ═══════════════════════════════════════
# 技术栈 *
# ═══════════════════════════════════════
tech_stack:
  type: html-demo       # 固定填 html-demo，表示本地 HTML 演示文件
  ui_style: shadcn      # 固定填 shadcn，使用 shadcn/ui 风格组件
  css: tailwind-cdn     # 固定填 tailwind-cdn，通过 CDN 引入 Tailwind
  icons: lucide         # 固定填 lucide，使用 Lucide 图标库
  data: mock            # 固定填 mock，所有数据为演示用假数据

# ═══════════════════════════════════════
# 业务背景 *（越详细越好，直接影响 AI 理解你的需求）
# ═══════════════════════════════════════
business:
  domain: "项目管理"            # 业务领域，如：企业采购 / 项目管理 / 人力资源
  users: "信息办管理员、信息办领导、用户单位分管领导、用户单位系统管理员、用户单位项目负责人、用户单位项目协助人、合同管理员、财务管理员、专家委员会"             # 使用这个系统的人是谁，如：采购员、审批人、财务人员
  core_flows: "需求征集 → 初筛遴选 → 立项申报 → 论证评审 → 立项审批 → 立项下达 → 采购调研 → 采购执行 → 合同签订 → 项目实施 → 进度监控 → 内部初验 → 正式验收 → 项目移交 → 运维管理 → 绩效评估 → 报废"        # 核心业务流程，如：提交申请 → 部门审批 → 财务审批 → 执行采购
  key_concepts: "需求征集、立项论证、立项申报、需求申报"      # 项目中的关键业务概念，如：需求单、采购订单、供应商、审批节点

# ═══════════════════════════════════════
# 页面规范
# ═══════════════════════════════════════
pages:
  language: zh-CN       # 页面语言，固定中文
  layout: sidebar       # 整体布局：sidebar（左侧菜单）/ topnav（顶部导航）
  entry: index.html     # 入口文件名
  color_theme: neutral  # 主色调：neutral（中性灰）/ blue（蓝色）/ slate（石板灰）

# ═══════════════════════════════════════
# Mock 数据规范
# ═══════════════════════════════════════
mock_data:
  volume: 8             # 每个列表页的演示数据条数，建议 5-10 条
  style: realistic      # 数据风格：realistic（接近真实业务数据）/ placeholder（占位符）
  language: zh-CN       # 数据内容语言

# ═══════════════════════════════════════
# 状态与流程规范（如果你的项目涉及审批/流程）
# ═══════════════════════════════════════
workflow:
  has_approval: true    # 是否有审批流程：true / false
  status_colors:        # 各状态对应的颜色标签，AI 会统一使用这套颜色
    draft:    gray      # 草稿/待提交
    pending:  yellow    # 待审批/进行中
    approved: green     # 已通过/已完成
    rejected: red       # 已拒绝/已驳回
    closed:   slate     # 已关闭/已归档

# ═══════════════════════════════════════
# AI 行为规则
# ═══════════════════════════════════════
rules:
  propose:
    - 每次 propose 只处理一个页面或一个功能模块
    - 生成 design.md 时必须包含详细的页面布局描述
    - 所有页面必须包含顶部导航栏和左侧菜单
    - 菜单结构保持所有页面一致

  apply:
    - 所有样式通过 Tailwind CSS 类实现，禁止内联 style
    - 所有依赖通过 CDN 引入，禁止使用 npm 包
    - Mock 数据用 JavaScript 数组定义在 HTML 文件内部
    - 页面之间跳转使用相对路径，如 href="pages/xxx.html"
    - 所有表单操作（提交、审批等）用 JavaScript 模拟，弹出提示即可，无需真实接口

  archive:
    - 归档前确认 HTML 文件在浏览器中可以正常打开
    - 归档后将 changes/ 文件同步到 wiki 的 raw/openspec/ 目录
