<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>信息化项目全生命周期管理系统 — 演示登录</title>
  <link rel="stylesheet" href="shared/style.css">
  <style>
    body {
      background: var(--primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    /* Subtle geometric background pattern */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59,130,246,.2), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(37,99,235,.1), transparent),
        linear-gradient(180deg, #1e40af 0%, #2563eb 100%);
      z-index: 0;
    }
    /* Floating geometric accents */
    body::after {
      content: '';
      position: fixed;
      top: -120px;
      right: -80px;
      width: 400px;
      height: 400px;
      border: 1px solid rgba(96,165,250,.12);
      border-radius: 50%;
      z-index: 0;
    }
    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 920px;
      max-width: 95vw;
    }
    .sys-brand {
      text-align: center;
      margin-bottom: 32px;
      animation: brandEnter .6s ease both;
    }
    .sys-org {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 500;
      color: #93c5fd;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .sys-name {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 900;
      color: #f1f5f9;
      letter-spacing: 3px;
      line-height: 1.3;
    }
    .sys-name-sub {
      font-size: 13px;
      color: #64748b;
      margin-top: 6px;
      font-weight: 400;
      letter-spacing: 1px;
    }
    @keyframes brandEnter {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: none; }
    }
    .login-box {
      background: rgba(255,255,255,.97);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 40px 44px;
      border: 1px solid rgba(226,232,240,.5);
      box-shadow: 0 25px 60px rgba(0,0,0,.3), 0 0 0 1px rgba(255,255,255,.05);
      animation: boxEnter .5s ease .15s both;
    }
    @keyframes boxEnter {
      from { opacity: 0; transform: translateY(20px) scale(.98); }
      to { opacity: 1; transform: none; }
    }
    .login-title {
      text-align: center;
      margin-bottom: 6px;
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }
    .login-sub {
      text-align: center;
      margin-bottom: 32px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .login-sub span {
      display: inline-block;
      padding: 2px 10px;
      background: #eff6ff;
      color: var(--accent);
      border-radius: 12px;
      font-weight: 600;
      font-size: 11px;
      margin-left: 4px;
    }
    .role-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }
    .role-card {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 18px 14px;
      text-align: center;
      cursor: pointer;
      transition: all .25s cubic-bezier(.4,0,.2,1);
      background: #fff;
      position: relative;
      overflow: hidden;
    }
    .role-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(37,99,235,.04), transparent);
      opacity: 0;
      transition: opacity .25s ease;
    }
    .role-card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(37,99,235,.15), 0 2px 6px rgba(0,0,0,.06);
    }
    .role-card:hover::before { opacity: 1; }
    .role-card:active { transform: translateY(-2px); }
    .role-card .icon { margin-bottom: 10px; display: flex; justify-content: center; position: relative; z-index: 1; }
    .role-card .name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 5px;
      position: relative; z-index: 1;
    }
    .role-card .desc {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.5;
      position: relative; z-index: 1;
    }
    /* Staggered entrance animation */
    .role-card { animation: cardFlyIn .4s ease both; }
    .role-card:nth-child(1)  { animation-delay: .2s; }
    .role-card:nth-child(2)  { animation-delay: .25s; }
    .role-card:nth-child(3)  { animation-delay: .3s; }
    .role-card:nth-child(4)  { animation-delay: .35s; }
    .role-card:nth-child(5)  { animation-delay: .4s; }
    .role-card:nth-child(6)  { animation-delay: .45s; }
    .role-card:nth-child(7)  { animation-delay: .5s; }
    .role-card:nth-child(8)  { animation-delay: .55s; }
    .role-card:nth-child(9)  { animation-delay: .6s; }
    .role-card:nth-child(10) { animation-delay: .65s; }
    .role-card:nth-child(11) { animation-delay: .7s; }
    .role-card:nth-child(12) { animation-delay: .75s; }
    @keyframes cardFlyIn {
      from { opacity: 0; transform: translateY(16px) scale(.95); }
      to { opacity: 1; transform: none; }
    }
    .demo-notice {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: #475569;
      opacity: 0;
      animation: fadeUp .4s ease .9s both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: .7; transform: none; }
    }
    @media (max-width: 700px) {
      .role-grid { grid-template-columns: repeat(2, 1fr); }
      .login-box { padding: 28px 20px; }
      .sys-name { font-size: 22px; }
    }
  </style>
  <script src="shared/data.js"></script>
</head>
<body>
  <div class="login-wrapper">
    <div class="sys-brand">
      <div class="sys-org">西南大学 · 数智化建设管理平台</div>
      <div class="sys-name">信息化项目全生命周期管理系统</div>
      <div class="sys-name-sub">Informatization Project Lifecycle Management System</div>
    </div>
    <div class="login-box">
      <div class="login-title">选择角色进入系统</div>
      <div class="login-sub">演示模式 <span>DEMO</span></div>
      <div class="role-grid" id="role-grid"></div>
      <div class="demo-notice">进入系统后可随时通过顶部菜单栏切换角色，所有数据均为演示用模拟数据</div>
    </div>
  </div>
  <script>
    const descs = { 'project-leader':'审定重大项目立项','office-leader':'审定中小型项目、接收汇报','info-leader':'遴选、论证组织、审批、验收','info-admin':'发起征集、下达通知、节点确认','unit-leader':'审核本单位需求与申请','unit-sysadmin':'指派填报任务、排序提交','project-manager':'李明·教务处，填报全流程表单','project-assistant':'协助项目负责人填报','contract-admin':'合同审核与台账管理','finance-admin':'经费使用情况查看','expert':'参与论证评审与验收评审','sys-admin':'用户权限与流程配置' };
    const grid = document.getElementById('role-grid');
    DATA.roles.forEach(role => {
      const card = document.createElement('div');
      card.className = 'role-card';
      card.innerHTML = '<div class="icon"><span class="role-icon-badge">' + role.icon + '</span></div><div class="name">' + role.short + '</div><div class="desc">' + (descs[role.id] || '') + '</div>';
      card.onclick = () => { localStorage.setItem('currentRole', role.id); window.location.href = 'app.html#dashboard'; };
      grid.appendChild(card);
    });
  </script>
</body>
</html>
